  <!-- Nav Logo -->
  <text x="52" y="36" font-family="Georgia, serif" font-size="15" fill="#1a1a1a" font-style="italic" letter-spacing="1">Elara James</text>
  <line x1="52" y1="40" x2="148" y2="40" stroke="#b99254" stroke-width="1" opacity="0.6"/>

  <!-- Nav links -->
  <text x="540" y="35" font-family="Arial, sans-serif" font-size="9" fill="#8a7a6a" letter-spacing="3" text-transform="uppercase">WORK</text>
