  <text x="340" y="454" font-family="Georgia, serif" font-size="13" fill="#1a1a1a">E-commerce — Scale Phase</text>
  <text x="340" y="474" font-family="Arial, sans-serif" font-size="9" fill="#8a7a6a">Rebuilt offer stack and sales process.</text>
  <text x="340" y="488" font-family="Arial, sans-serif" font-size="9" fill="#8a7a6a">Tripled AOV in 60 days.</text>
  <text x="340" y="520" font-family="Georgia, serif" font-size="24" fill="#1a1a1a">3× AOV</text>
  <text x="340" y="538" font-family="Arial, sans-serif" font-size="8" fill="#8a7a6a" letter-spacing="1.5">AVERAGE ORDER VALUE</text>
  <text x="340" y="560" font-family="Arial, sans-serif" font-size="8" fill="#b99254">→ Read case study</text>

  <rect x="596" y="426" width="256" height="148" fill="#1a1a1a" rx="2"/>
