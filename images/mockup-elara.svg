  <text x="68" y="520" font-family="Georgia, serif" font-size="24" fill="#b99254">+$420K</text>
  <text x="68" y="538" font-family="Arial, sans-serif" font-size="8" fill="#8a7a6a" letter-spacing="1.5">NEW REVENUE</text>
