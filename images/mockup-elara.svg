  <text x="612" y="454" font-family="Georgia, serif" font-size="13" fill="#faf8f5">Consulting Firm — Rebrand</text>
  <text x="612" y="474" font-family="Arial, sans-serif" font-size="9" fill="#8a7a60">New positioning attracted top-tier</text>
  <text x="612" y="488" font-family="Arial, sans-serif" font-size="9" fill="#8a7a60">clients at 3× previous rates.</text>
  <text x="612" y="520" font-family="Georgia, serif" font-size="24" fill="#b99254">92%</text>
  <text x="612" y="538" font-family="Arial, sans-serif" font-size="8" fill="#8a7a60" letter-spacing="1.5">CLOSE RATE</text>
  <text x="612" y="560" font-family="Arial, sans-serif" font-size="8" fill="#b99254">→ Read case study</text>

  <!-- Bottom gold line -->
