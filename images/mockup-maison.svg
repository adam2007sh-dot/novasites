<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208"/>
      <stop offset="100%" style="stop-color:#0d0c0a"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b99254"/>
      <stop offset="100%" style="stop-color:#d4a96a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#211a0e"/>
      <stop offset="100%" style="stop-color:#1a1208"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg1)"/>

  <!-- Subtle texture overlay -->
  <rect width="900" height="600" fill="none" stroke="#b99254" stroke-width="0.3" opacity="0.08"/>

  <!-- Nav bar -->
  <rect x="0" y="0" width="900" height="52" fill="#100e08" opacity="0.95"/>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#b99254" stroke-width="0.5" opacity="0.3"/>

  <!-- Nav logo -->
  <text x="48" y="33" font-family="Georgia, serif" font-size="16" fill="#f5ede0" font-style="italic" letter-spacing="2">MAISON</text>
  <text x="115" y="33" font-family="Georgia, serif" font-size="16" fill="#b99254" letter-spacing="2">COLLECTIVE</text>

  <!-- Nav links -->
  <text x="560" y="33" font-family="Arial, sans-serif" font-size="9" fill="#8a7a60" letter-spacing="3" text-transform="uppercase">COLLECTION</text>
  <text x="660" y="33" font-family="Arial, sans-serif" font-size="9" fill="#8a7a60" letter-spacing="3">ATELIER</text>
  <text x="740" y="33" font-family="Arial, sans-serif" font-size="9" fill="#8a7a60" letter-spacing="3">ABOUT</text>
  <rect x="810" y="18" width="72" height="18" fill="#b99254" rx="1"/>
  <text x="846" y="31" font-family="Arial, sans-serif" font-size="7.5" fill="#100e08" letter-spacing="2" text-anchor="middle" font-weight="bold">EXPLORE</text>

  <!-- Hero area -->
  <rect x="0" y="52" width="900" height="310" fill="url(#bg1)"/>

  <!-- Large product image area (right side) -->
  <rect x="480" y="72" width="380" height="270" fill="#1e1608" rx="2"/>
  <!-- Simulated vase/product -->
  <ellipse cx="670" cy="285" rx="55" ry="12" fill="#2a1f0e" opacity="0.8"/>
  <rect x="638" y="160" width="64" height="130" fill="#c4a26b" rx="4"/>
  <rect x="645" y="140" width="50" height="30" fill="#b8924a" rx="20"/>
  <rect x="652" y="128" width="36" height="24" fill="#caa870" rx="16"/>
  <!-- Decorative lines on vase -->
  <line x1="645" y1="175" x2="702" y2="175" stroke="#8a6030" stroke-width="0.8" opacity="0.6"/>
  <line x1="645" y1="195" x2="702" y2="195" stroke="#8a6030" stroke-width="0.8" opacity="0.6"/>
  <line x1="645" y1="215" x2="702" y2="215" stroke="#8a6030" stroke-width="0.8" opacity="0.6"/>
  <!-- Leaf/plant -->
  <ellipse cx="730" cy="200" rx="18" ry="35" fill="#2d4a2d" transform="rotate(-20 730 200)"/>
  <ellipse cx="742" cy="215" rx="14" ry="28" fill="#3a5e3a" transform="rotate(15 742 215)"/>

  <!-- Hero text (left side) -->
  <text x="48" y="115" font-family="Georgia, serif" font-size="11" fill="#b99254" letter-spacing="4">LUXURY HOME COLLECTION</text>
  <line x1="48" y1="122" x2="90" y2="122" stroke="#b99254" stroke-width="1" opacity="0.6"/>

  <text x="48" y="158" font-family="Georgia, serif" font-size="38" fill="#f5ede0" letter-spacing="-1">Curated for the</text>
  <text x="48" y="200" font-family="Georgia, serif" font-size="38" fill="#f5ede0" font-style="italic" letter-spacing="-1">Discerning Eye</text>

  <text x="48" y="236" font-family="Arial, sans-serif" font-size="12" fill="#8a7a60" letter-spacing="0.5">Artisan-crafted objects for spaces that</text>
  <text x="48" y="254" font-family="Arial, sans-serif" font-size="12" fill="#8a7a60" letter-spacing="0.5">tell a story of taste and intention.</text>

  <rect x="48" y="272" width="160" height="38" fill="#b99254" rx="1"/>
  <text x="128" y="296" font-family="Arial, sans-serif" font-size="8.5" fill="#100e08" letter-spacing="3" text-anchor="middle" font-weight="bold">SHOP COLLECTION</text>
  <rect x="220" y="272" width="140" height="38" fill="none" stroke="#b99254" stroke-width="1" rx="1" opacity="0.6"/>
  <text x="290" y="296" font-family="Arial, sans-serif" font-size="8.5" fill="#b99254" letter-spacing="2" text-anchor="middle">OUR STORY →</text>

  <!-- Product grid section -->
  <rect x="0" y="365" width="900" height="235" fill="#0d0c09"/>
  <line x1="48" y1="365" x2="852" y2="365" stroke="#b99254" stroke-width="0.5" opacity="0.2"/>

  <text x="48" y="400" font-family="Georgia, serif" font-size="20" fill="#f5ede0" letter-spacing="-0.5">New Arrivals</text>

  <!-- Product cards -->
  <rect x="48" y="418" width="185" height="155" fill="#181409" rx="2"/>
  <rect x="48" y="418" width="185" height="108" fill="#251e10"/>
  <ellipse cx="140" cy="472" rx="30" ry="30" fill="#c4a26b" opacity="0.8"/>
  <rect x="130" y="448" width="20" height="50" fill="#b8924a"/>
  <text x="56" y="543" font-family="Georgia, serif" font-size="11" fill="#f5ede0">Terracotta Amphora</text>
  <text x="56" y="560" font-family="Arial, sans-serif" font-size="10" fill="#b99254">€ 340</text>

  <rect x="249" y="418" width="185" height="155" fill="#181409" rx="2"/>
  <rect x="249" y="418" width="185" height="108" fill="#1e1a0e"/>
  <rect x="309" y="440" width="65" height="85" fill="#8a6030" rx="2"/>
  <rect x="319" y="435" width="45" height="14" fill="#a07040" rx="6"/>
  <text x="257" y="543" font-family="Georgia, serif" font-size="11" fill="#f5ede0">Woven Rattan Lamp</text>
  <text x="257" y="560" font-family="Arial, sans-serif" font-size="10" fill="#b99254">€ 520</text>

  <rect x="450" y="418" width="185" height="155" fill="#181409" rx="2"/>
  <rect x="450" y="418" width="185" height="108" fill="#16180e"/>
  <ellipse cx="542" cy="480" rx="40" ry="16" fill="#3a5e3a" opacity="0.7"/>
  <ellipse cx="542" cy="466" rx="28" ry="18" fill="#4a7a4a"/>
  <rect x="537" y="482" width="10" height="44" fill="#5a4a2a"/>
  <text x="458" y="543" font-family="Georgia, serif" font-size="11" fill="#f5ede0">Olive Tree Specimen</text>
  <text x="458" y="560" font-family="Arial, sans-serif" font-size="10" fill="#b99254">€ 890</text>

  <rect x="651" y="418" width="185" height="155" fill="#181409" rx="2"/>
  <rect x="651" y="418" width="185" height="108" fill="#14100d"/>
  <rect x="711" y="445" width="65" height="65" fill="#2a1f14" rx="1" stroke="#b99254" stroke-width="0.8" opacity="0.5"/>
  <rect x="718" y="452" width="51" height="51" fill="#b99254" opacity="0.15"/>
  <text x="659" y="543" font-family="Georgia, serif" font-size="11" fill="#f5ede0">Marble Side Table</text>
  <text x="659" y="560" font-family="Arial, sans-serif" font-size="10" fill="#b99254">€ 1,240</text>

  <!-- Gold accent line -->
  <rect x="0" y="598" width="900" height="2" fill="url(#gold1)" opacity="0.6"/>
</svg>
